receivers:
  hostmetrics:
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/hostmetricsreceiver/README.md
    collection_interval: 1s
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      load:
      filesystem:
      memory:
      network:
      nfs:
      paging:
      processes:
      process:
      system:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  resource_detection/docker:
    detectors: [docker]

exporters:
  otlp:
    # endpoint: "{target hostname}:{target port}"
    endpoint: "localhost:24317"
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: debug
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resource_detection/docker]
      exporters: [otlp]
    traces:
      receivers: [otlp]
      exporters: [otlp]