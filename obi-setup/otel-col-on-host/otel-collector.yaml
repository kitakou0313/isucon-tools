receivers:
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
      memory:
      disk:
      network:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

exporters:
  otlp:
    endpoint: "{target hostname}:{target port}"
    # endpoint: "localhost:24317"
    tls:
      insecure: true 

service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      exporters: [otlp]
    traces:
      receivers: [otlp]
      exporters: [otlp]